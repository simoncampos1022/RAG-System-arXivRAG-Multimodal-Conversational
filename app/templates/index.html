<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocChat: Multi-modal RAG Application</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Left Panel (40% width) -->
        <div class="panel left-panel">
            <!-- Model Configuration Section (40% height) -->
            <div class="section model-config-section">
                <div class="section-header">
                    <h2>Model Configuration</h2>
                    <div class="tooltip">
                        <i class="fas fa-info-circle"></i>
                        <span class="tooltip-text">Note: Free-tier API keys are rate-limited and slow.</span>
                    </div>
                </div>
                <div class="config-grid">
                    <div class="config-item">
                        <label for="api-key">API Key:</label>
                        <input type="password" id="api-key" placeholder="Enter your Gemini API key">
                    </div>
                    <div class="config-item">
                        <label for="model-select">Model:</label>
                        <select id="model-select">
                            <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash-Lite</option>
                            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                            <option value="gemini-2.5-flash-lite-preview-06-17">Gemini 2.5 Flash-Lite Preview 06-17</option>
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                        </select>
                    </div>
                    <div class="config-item">
                        <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.7">
                        <label for="temperature">Temperature: <span id="temp-value">0.7</span></label>
                    </div>
                    <div class="config-item">
                        <button id="save-config" class="btn primary-btn">Save Configuration</button>
                    </div>
                </div>
            </div>
            
            <!-- File Upload & Processing Section (60% height) -->
            <div class="section file-upload-section">
                <h2>File Upload & Processing</h2>
                <div class="dropzone" id="upload-dropzone">
                    <div class="dropzone-content">
                        <i class="fas fa-file-pdf fa-3x"></i>
                        <p>Drag & drop PDF files here<br>or<br>click to browse</p>
                        <input type="file" id="file-input" multiple accept=".pdf" style="display: none;">
                    </div>
                    <div class="file-list" id="file-list"></div>
                </div>
                <div class="processing-controls">
                    <button id="analyze-btn" class="btn primary-btn" disabled>Analyze Documents</button>
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar">
                            <div class="progress-fill"></div>
                        </div>
                        <span id="progress-status">Ready</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Right Panel (60% width) -->
        <div class="panel right-panel">
            <!-- Query Input Section (40% height) -->
            <div class="section query-section">
                <h2>Query Input</h2>
                <textarea id="query-input" placeholder="Enter your question about the uploaded documents..."></textarea>
                <button id="generate-btn" class="btn primary-btn" disabled>Generate Answer</button>
            </div>
            
            <!-- Response Output Section (60% height) -->
            <div class="section response-section">
                <h2>Response Output</h2>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="answer">Answer</button>
                    <button class="tab-btn" data-tab="citations">Citations</button>
                </div>
                <div class="tab-content">
                    <div id="answer-tab" class="tab-pane active">
                        <div id="answer-content" class="content-area"></div>
                    </div>
                    <div id="citations-tab" class="tab-pane">
                        <div id="citations-content" class="content-area"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification Container -->
    <div id="toast-container"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
